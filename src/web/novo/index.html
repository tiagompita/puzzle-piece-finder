<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131519">
<title>Montar</title>
<link rel="stylesheet" href="../board.css">
<link rel="stylesheet" href="novo.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <span class="brand-name" id="puzzle-name">Puzzle</span>
      <span class="brand-sub" id="progress-txt">a carregar…</span>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar"><span id="pb-n"></span></div></div>
    <nav id="tabs" role="tablist" aria-label="Separadores">
      <button type="button" role="tab" data-tab="montar" class="on" aria-selected="true">Montar <b id="n-montar"></b></button>
      <button type="button" role="tab" data-tab="pecas" aria-selected="false">Peças</button>
      <button type="button" role="tab" data-tab="importar" aria-selected="false">Importar scan</button>
    </nav>
    <form id="search" role="search" autocomplete="off">
      <input id="q" class="search" type="search" placeholder="procurar peça ou lugar" aria-label="Procurar peça ou lugar" enterkeyhint="search">
    </form>
    <div class="menu-wrap">
      <button type="button" id="menu-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Mais">⋯</button>
      <div id="menu" class="menu" hidden role="menu">
        <a role="menuitem" href="/" id="m-diag">Diagnóstico (interface completa)</a>
        <button type="button" role="menuitem" id="m-atividade">Atividade do programa</button>
        <label class="menu-check"><input type="checkbox" id="m-fantasmas"> Mostrar a forma esperada</label>
        <label class="menu-check"><input type="checkbox" id="m-borda"> Mostrar a borda em falta</label>
        <label class="menu-check"><input type="checkbox" id="m-guardadas"> Mostrar peças guardadas à parte</label>
        <div class="menu-keys" id="m-teclas">Teclas: Enter = Encaixa · N = Não encaixa · S = Saltar · Ctrl+Z = desfazer</div>
      </div>
    </div>
  </header>

  <main id="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Tabuleiro">
      <defs>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="0.2" height="0.2" patternTransform="rotate(45)">
          <rect class="hatch-bg" x="0" y="0" width="0.2" height="0.2"></rect>
          <line class="hatch-line" x1="0.05" y1="0" x2="0.05" y2="0.2"></line>
        </pattern>
      </defs>
      <rect id="board-bg" x="0" y="0" width="1" height="1"></rect>
      <image id="raster" x="0" y="0" preserveAspectRatio="none"></image>
      <image id="detail" x="0" y="0" preserveAspectRatio="none" visibility="hidden"></image>
      <g id="lyr-legado"></g>
      <g id="lyr-borda"></g>
      <g id="lyr-conhecida"></g>
      <g id="lyr-fantasma"></g>
      <g id="lyr-seguinte"></g>
      <g id="lyr-alvo"></g>
      <g id="lyr-grelha"></g>
    </svg>
    <div class="zoom-ui">
      <button type="button" id="z-in" aria-label="Aproximar">+</button>
      <button type="button" id="z-out" aria-label="Afastar">−</button>
      <button type="button" id="z-fit" aria-label="Ver o tabuleiro inteiro" title="Ver o tabuleiro inteiro">⤢</button>
    </div>
    <div id="legend" class="legend-short" aria-label="Legenda"></div>
  </main>

  <aside id="panel">
    <section class="tab on" id="tab-montar" aria-live="polite"></section>
    <section class="tab" id="tab-pecas"></section>
    <section class="tab" id="tab-importar"></section>
  </aside>
</div>

<div id="lightbox" hidden>
  <button type="button" class="lb-close" id="lb-close">Fechar</button>
  <div class="lb-body"><img id="lb-img" alt=""></div>
  <div class="lb-cap" id="lb-cap"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="../core.js"></script>
<script src="../board.js"></script>
<script src="novo.js"></script>
</body>
</html>
