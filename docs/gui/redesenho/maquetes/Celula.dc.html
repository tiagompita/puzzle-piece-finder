<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Peça no tabuleiro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#131519}
a{color:#f2b43c}a:hover{color:#ffd27a}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 900px; background: #131519; color: #ecebe7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 12px 24px; border-bottom: 1px solid #323742; background: #1c1f25">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 220px">
      <div style="font-size: 16px; font-weight: 600">Os Alpes</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 140px; height: 6px; border-radius: 3px; background: #323742; overflow: hidden"><div style="width: 22%; height: 6px; background: #6fc3c9"></div></div>
        <div style="font-size: 13px; color: #a9adb6">672 de 3008 peças</div>
      </div>
    </div>
    <nav aria-label="Secções" style="display: flex; gap: 4px; flex: 1 1 auto">
      <a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #f2b43c; color: #1a1405; font-size: 15px; font-weight: 600; text-decoration: none">Montar</a>
      <a href="Pecas.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; color: #ecebe7; font-size: 15px; font-weight: 500; text-decoration: none">Peças</a>
      <a href="Importar.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; color: #ecebe7; font-size: 15px; font-weight: 500; text-decoration: none">Importar scan</a>
    </nav>
    <button type="button" aria-label="Mais: diagnóstico e definições" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #323742; background: #252931; color: #ecebe7; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </header>

  <main style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 24px; flex: 1 1 auto">

    <section aria-label="Tabuleiro" style="flex: 999 1 560px; min-width: 0">
      <div style="position: relative; width: 100%; aspect-ratio: 64 / 47; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #8fb6dc 0%, #c9d7e2 22%, #f0d8a2 34%, #b9a27c 46%, #6f8f5a 62%, #48693f 100%)">
        <div style="position: absolute; left: 0; right: 0; top: 30%; bottom: 14%; background: rgba(19,21,25,0.72)"></div>
        <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(255,255,255,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.10) 1px, transparent 1px); background-size: 6.25% 8.51%"></div>
        <div style="position: absolute; left: 62.5%; top: 8.51%; width: 6.25%; height: 8.51%; box-sizing: border-box; border: 4px solid #ffffff; border-radius: 4px; box-shadow: 0 0 0 3px rgba(19,21,25,0.8)"></div>
      </div>
    </section>

    <aside aria-label="Peça selecionada" style="flex: 1 1 380px; max-width: 460px; display: flex; flex-direction: column; gap: 14px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #ecebe7; font-size: 15px; font-weight: 500; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        Voltar à fila
      </a>

      <div style="background: #1c1f25; border: 1px solid #323742; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: center; gap: 18px">
          <div style="width: 120px; height: 120px; border-radius: 12px; background: #252931; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
            <svg role="img" aria-label="A peça" width="100" height="100" viewBox="0 0 100 100"><path d="M20 20 L40 20 C40 20 36 8 50 8 C64 8 60 20 60 20 L80 20 L80 40 C80 40 68 36 68 50 C68 64 80 60 80 60 L80 80 L60 80 C60 80 64 92 50 92 C36 92 40 80 40 80 L20 80 L20 60 C20 60 32 64 32 50 C32 36 20 40 20 40 Z" fill="#a9c6e3" stroke="#e3f0fb" stroke-width="1.5"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 24px; font-weight: 700; line-height: 1.15">Saco 7 · peça nº 20</div>
            <div style="font-size: 16px">Linha 4 · coluna 57</div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #6fc3c9"></span><span style="font-size: 14px; color: #a9adb6">No lugar · posta por ti a 9 nov</span></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 14px; color: #a9adb6">Na folha que digitalizaste</div>
          <button type="button" aria-label="Ampliar a folha original" style="padding: 12px; border: 0; border-radius: 10px; background: #74d06f; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{sheet}}" as="p" hint-placeholder-count="16">
              <span style="{{p.style}}"></span>
            </sc-for>
          </button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #a9adb6">
          <span>Identificador</span>
          <span style="font-weight: 600; color: #ecebe7">P1203</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid #5a6170; background: #252931; color: #ecebe7; font-size: 16px; font-weight: 600">Tirar do lugar</button>
        <div style="display: flex; gap: 10px">
          <a href="Editor.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1px solid #323742; background: #1c1f25; color: #ecebe7; font-size: 15px; font-weight: 500; text-decoration: none">Corrigir recorte</a>
          <button type="button" style="flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 1px solid #323742; background: #1c1f25; color: #ecebe7; font-size: 15px; font-weight: 500">Algo está errado</button>
        </div>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var fills = ['#ead9a4', '#a9c6e3', '#7c9a63', '#d9c08a', '#8fb0d2', '#5f7f4c'];
var sheet = [];
for (var i = 0; i < 16; i++) {
var s = 'display:block;aspect-ratio:1/1;border-radius:4px;background:' + fills[(i * 5 + (i % 4)) % fills.length] + ';';
if (i === 5) { s = 'display:block;aspect-ratio:1/1;border-radius:4px;background:#a9c6e3;box-shadow:0 0 0 3px #1a1405,0 0 0 6px #f2b43c;'; }
sheet.push({ style: s });
}
return { sheet: sheet };
}
}
</script>
</body>
</html>
